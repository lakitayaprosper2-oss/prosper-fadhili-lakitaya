<!DOCTYPE html>
<html>
<head>
    <title>Hospital Patient Records</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Hospital Patient Records</h1>
</header>

<section class="form-section">
    <h2>Add Patient</h2>

    <input type="text" id="name" placeholder="Patient Name">
    <input type="number" id="age" placeholder="Age">

    <select id="gender">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
    </select>

    <input type="text" id="diagnosis" placeholder="Diagnosis">

    <button onclick="addPatient()">Add Patient</button>
</section>

<section>
    <h2>Search Patient</h2>

    <input
        type="text"
        id="search"
        placeholder="Search by name"
        onkeyup="searchPatient()"
    >
</section>

<section>
    <h2>Hospital Statistics</h2>
    <p>Total Patients: <span id="patientCount">0</span></p>
</section>

<section>
    <h2>Patient Records</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Diagnosis</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="patientTable"></tbody>
    </table>
</section>

<script src="script.js"></script>

</body>
</html>
